name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Typecheck, Jest & Web Export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production dependency security gate
        run: npm run security:audit

      - name: Typecheck
        run: npm run typecheck

      - name: Jest
        run: npm test -- --ci --coverage --coverageThreshold='{"global":{"lines":80}}'

      - name: Web production export
        run: npm run web:export
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://example.supabase.co' }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'trainerhub-ci-placeholder-key' }}

      - name: Upload web export
        uses: actions/upload-artifact@v6
        with:
          name: trainerhub-web-export
          path: dist-ci/
          retention-days: 7

  build-preview:
    name: EAS preview build (iOS simulator)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build
        run: eas build --platform ios --profile preview --non-interactive --wait
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

  e2e:
    name: Maestro E2E
    runs-on: macos-latest
    needs: build-preview
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Maestro
        run: curl -Ls "https://get.maestro.mobile.dev" | bash

      - name: Boot iOS simulator
        run: |
          xcrun simctl boot "iPhone 16" || true
          xcrun simctl bootstatus "iPhone 16"

      - name: Install app on simulator
        run: |
          npx expo run:ios --no-bundler --simulator "iPhone 16"

      - name: Seed OTP via Supabase Admin
        id: seed-otp
        run: |
          curl -s -X POST \
            "${{ secrets.SUPABASE_URL }}/auth/v1/otp" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"${{ secrets.E2E_TRAINER_EMAIL }}\"}" >/dev/null
          OTP_CODE=$(curl -s -X POST \
            "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/get_otp_for_email" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"p_email\":\"${{ secrets.E2E_TRAINER_EMAIL }}\"}" \
            | jq -r '.')
          test -n "$OTP_CODE" && test "$OTP_CODE" != "null"
          echo "otp=$OTP_CODE" >> "$GITHUB_OUTPUT"

      - name: Run Maestro flow
        env:
          TRAINER_EMAIL: ${{ secrets.E2E_TRAINER_EMAIL }}
          MAESTRO_OTP: ${{ steps.seed-otp.outputs.otp }}
          CLIENT_EMAIL: ${{ secrets.E2E_CLIENT_EMAIL }}
        run: ~/.maestro/bin/maestro test .maestro/sign-in-create-client.yml

      - name: Upload Maestro artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: maestro-results
          path: ~/.maestro/tests/
          if-no-files-found: ignore
