version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 10
    groups:
      expo-runtime:
        patterns:
          - "expo*"
          - "react"
          - "react-dom"
          - "react-native*"
      supabase:
        patterns:
          - "@supabase/*"
      navigation:
        patterns:
          - "@react-navigation/*"
          - "expo-router"
    commit-message:
      prefix: deps
